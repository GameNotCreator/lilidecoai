services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visualizer}
      POSTGRES_USER: ${POSTGRES_USER:-visualizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visualizer-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visualizer}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ENVIRONMENT: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visualizer}:${POSTGRES_PASSWORD:-visualizer-local}@postgres:5432/${POSTGRES_DB:-visualizer}
      REDIS_URL: redis://redis:6379/0
      PUBLIC_API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-development-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - api-storage:/app/services/api/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-storage:

